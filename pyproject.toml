[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cu-perceive"
version = "0.1.0"
description = "Local YOLO+OCR perceive: CLI and MCP, no names, no click"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.19.0",
  "pillow>=11.2.0",
  "opencv-python>=4.10.0",
  "numpy>=2.0.0",
]

[project.scripts]
cu-perceive = "cu_perceive.cli:main"

[tool.setuptools.packages.find]
include = ["cu_perceive"]
